name: Build Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean HTML & Build Standalone App
        run: |
          npm install --legacy-peer-deps
          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/<script type="importmap">[\s\S]*?<\/script>/gi, "");
            fs.writeFileSync("index.html", html);
          '
          npx vite build --base=./

      - name: Add Capacitor Android & Native USB MIDI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Korg Oriental Commander" "com.waelchetoui.korgcommander" --web-dir dist
          npx cap add android
          npx cap sync android
          cat << 'EOF' > android/app/src/main/assets/public/debug-fix.js
          window.addEventListener("error", function(e) {
            document.body.style.background = "#111";
            document.body.style.color = "#ff5555";
            document.body.innerHTML = "<div style=\"padding:20px;font-family:sans-serif\"><h3>Error:</h3>" + e.message + "</div>";
          });
          EOF
          sed -i 's/<head>/<head><script src="debug-fix.js"><\/script>/' android/app/src/main/assets/public/index.html

      - name: Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-apk
          name: Korg Oriental Commander APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
